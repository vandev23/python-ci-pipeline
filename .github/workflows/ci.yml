name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      # -------- Checkout PR code --------
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------- Set up Python --------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # -------- Install dependencies --------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------- Run tests with coverage (PR) --------
      - name: Run tests with coverage (PR)
        run: |
          PYTHONPATH=. pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing
          mv coverage.xml coverage-pr.xml
          mv htmlcov htmlcov-pr

      # -------- Run tests with coverage (main) --------
      - name: Run tests on main branch
        run: |
          git fetch origin main
          git checkout origin/main
          PYTHONPATH=. pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
          mv coverage.xml coverage-main.xml
          git checkout -

      # -------- Compare coverage --------
      - name: Compare coverage
        id: coverage
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import os

          def rate(path):
              tree = ET.parse(path)
              return float(tree.getroot().attrib["line-rate"]) * 100

          pr = rate("coverage-pr.xml")
          main = rate("coverage-main.xml")
          diff = pr - main

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pr={pr:.2f}\n")
              f.write(f"main={main:.2f}\n")
              f.write(f"diff={diff:+.2f}\n")
          EOF

      # -------- Fail if coverage decreased --------
      - name: Fail if coverage decreased
        run: |
          python - <<EOF
          diff = float("${{ steps.coverage.outputs.diff }}")
          if diff < 0:
              raise SystemExit("❌ Coverage decreased")
          EOF

      # -------- Upload PR coverage to Codecov --------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-pr.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # -------- Deploy HTML coverage to gh-pages --------
      - name: Deploy HTML coverage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAGES_PAT }} 
          publish_dir: ./htmlcov-pr
          destination_dir: pr-${{ github.event.pull_request.number }}
          allow_empty_commit: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Add HTML coverage for PR #${{ github.event.pull_request.number }}"

      # -------- Comment coverage + HTML link on PR --------
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = "${{ steps.coverage.outputs.pr }}"
            const main = "${{ steps.coverage.outputs.main }}"
            const diff = "${{ steps.coverage.outputs.diff }}"
            const url = `https://vandev23.github.io/nessa-dev/pr-${context.issue.number}/index.html`

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧪 **Test Coverage**\n\nPR: **${pr}%**\nmain: **${main}%**\nΔ: **${diff}%**\n\n🔗 [View full HTML report here](${url})`
            })
