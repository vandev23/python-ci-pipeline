name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------- PR coverage ----------
      - name: Run tests with coverage (PR)
        run: |
          PYTHONPATH=. pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
          mv coverage.xml coverage-pr.xml

      # ---------- Main coverage ----------
      - name: Get main branch coverage
        run: |
          git checkout main
          PYTHONPATH=. pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
          mv coverage.xml coverage-main.xml
          git checkout -

      # ---------- Compare coverage ----------
      - name: Compare coverage
        id: coverage
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import os

          def rate(path):
              tree = ET.parse(path)
              return float(tree.getroot().attrib["line-rate"]) * 100

          pr = rate("coverage-pr.xml")
          main = rate("coverage-main.xml")
          diff = pr - main

          print(f"PR: {pr:.2f}%")
          print(f"main: {main:.2f}%")
          print(f"diff: {diff:+.2f}%")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pr={pr:.2f}\n")
              f.write(f"main={main:.2f}\n")
              f.write(f"diff={diff:+.2f}\n")
          EOF

      # ---------- Comment on PR ----------
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = "${{ steps.coverage.outputs.pr }}"
            const main = "${{ steps.coverage.outputs.main }}"
            const diff = "${{ steps.coverage.outputs.diff }}"
            const url = `https://codecov.io/gh/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}`

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🧪 **Test Coverage**\n\nPR: **${pr}%**\nmain: **${main}%**\nΔ: **${diff}%**\n\n🔗 [View full report on Codecov](${url})`
            })

      # ---------- Fail if coverage decreases ----------
      - name: Fail if coverage decreased
        run: |
          python - <<EOF
          diff = float("${{ steps.coverage.outputs.diff }}")
          if diff < 0:
              raise SystemExit("❌ Coverage decreased")
          EOF

      # ---------- Upload PR coverage ----------
      - name: Upload PR coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-pr.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
